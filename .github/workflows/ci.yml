name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Calidad (check, build y auditoría)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, formato y pruebas (con umbral de cobertura)
        run: npm run check
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Auditoría de dependencias de producción (bloquea)
        run: npm audit --omit=dev --audit-level=high
      - name: Auditoría completa, incluidas las de desarrollo (informativa)
        # picomatch <= 4.0.7 tiene un aviso sin versión corregida y lo traen las herramientas de
        # desarrollo. Se muestra aquí, pero no bloquea hasta que exista un parche.
        run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    name: Navegador (360, 768 y 1024 px con axe)
    needs: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --trace off
        env:
          NEXT_TELEMETRY_DISABLED: '1'
